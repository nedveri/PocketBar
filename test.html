<!DOCTYPE html>
<html>
<head>
  <style>
    /* Создаем невидимую или полупрозрачную плашку в самом верху окна */
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      /* Высота плашки. Подбирайте под размер кнопок Windows (обычно около 32px-40px) */
      height: 35px; 
      
      /* САМАЯ ВАЖНАЯ СТРОКА: делает область перетаскиваемой */
      -webkit-app-region: drag; 
      
      /* Для наглядности можно временно дать фоновый цвет, потом уберете */
      background-color: rgba(8, 206, 51, 0.05); 
      z-index: 9999;
    }

    /* Чтобы ваш основной контент не залезал под плашку, добавьте ему отступ сверху */
    .content {
      padding-top: 40px; 
      background-color: #a01818;
    }
  </style>
</head>
<body>

  <!-- Этот блок позволит перетаскивать окно -->
  <div class="titlebar"></div>

  <!-- Весь остальной ваш интерфейс оборачивайте ниже -->
  <div class="content">
    <h1>Привет, Electron!</h1>
    <!-- Ваш код -->
  </div>

</body>
</html>
