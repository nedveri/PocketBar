<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PocketBar</title>
    <!-- Разрешаем загрузку картинок с любых сайтов (https:) и локально (file:) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' http://localhost:5000; img-src 'self' data: https: file:;">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
 <div class="titlebar"></div>
<div class="app">

  <!-- Left column: 1/3 width, full height -->
  <aside class="panel left">
    <div class="brand">PocketBar</div>

    <div class="shelves">
      <div class="shelves-inner">

        <section class="shelf">
          <div class="shelf-row">
            <button class="item" data-name="Lime"><span class="img"><img src="../imgs/ingredients/lime.png" alt=""></span><span class="name">Lime</span></button>
            <button class="item" data-name="Mint"><span class="img"><img src="../imgs/ingredients/mint.png" alt=""></span><span class="name">Mint</span></button>
            <button class="item" data-name="Schweppes"><span class="img"><img src="../imgs/ingredients/schweppes.webp" alt=""></span><span class="name">Schweppes</span></button>
            <button class="item" data-name="Lemon"><span class="img"><img src="../imgs/ingredients/lemon.png" alt=""></span><span class="name">Lemon</span></button>
            <button class="item" data-name="Tonic"><span class="img"><img src="../imgs/ingredients/tonic.png" alt=""></span><span class="name">Tonic</span></button>
            <button class="item" data-name="Cola"><span class="img"><img src="../imgs/ingredients/cola.png" alt=""></span><span class="name">Cola</span></button>
            <button class="item" data-name="Ice"><span class="img"><img src="../imgs/ingredients/ice.png" alt=""></span><span class="name">Ice</span></button>
          </div>
        </section>

        <section class="shelf">
          <div class="shelf-row">
            <button class="item" data-name="Vodka"><span class="img"><img src="../imgs/ingredients/vodka.webp" alt=""></span><span class="name">Vodka</span></button>
            <button class="item" data-name="Gin"><span class="img"><img src="../imgs/ingredients/gin.png" alt=""></span><span class="name">Gin</span></button>
            <button class="item" data-name="Rum"><span class="img"><img src="../imgs/ingredients/rum.png" alt=""></span><span class="name">Rum</span></button>
            <button class="item" data-name="Tequila"><span class="img"><img src="../imgs/ingredients/tequila.png" alt=""></span><span class="name">Tequila</span></button>
            <button class="item" data-name="Whiskey"><span class="img"><img src="../imgs/ingredients/whisky.png" alt=""></span><span class="name">Whiskey</span></button>
            <button class="item" data-name="Vermouth"><span class="img"><img src="../imgs/ingredients/martini.webp" alt=""></span><span class="name">Vermouth</span></button>
            <button class="item" data-name="Liqueur"><span class="img"><img src="../imgs/ingredients/liqueur.webp" alt=""></span><span class="name">Liqueur</span></button>
          </div>
        </section>

      </div>
    </div>
  </aside>

  <!-- Right column: 2/3 width -->
  <div class="right">

    <!-- 1/3 height: bell and bartender -->
    <section class="panel counter">
      <button class="bell" id="bell" aria-label="Search cocktails">
        <img src="../imgs/bell.png" alt="">
      </button>
      
      <!-- Область реплик бармена -->
      <div class="bubble" id="bubble" aria-live="polite">
        <p id="joke">Welcome to PocketBar! Pick your ingredients.</p>
      </div>

      <div class="bartender">
        <img src="../imgs/bartender.png" alt="">
      </div>
    </section>

    <!-- 2/3 height: cards -->
    <main class="panel menu" id="menu">

      <div class="cobweb-corner" style="position: absolute; bottom: 0; right: 0; pointer-events: none; opacity: 0.35;">
    <svg width="250" height="250" viewBox="0 0 100 100" style="fill: none; stroke: #d4a373; stroke-width: 1.2; stroke-linecap: round;">
      <!-- Лучи из правого нижнего угла (100, 100) -->
      <path d="M100 100 L0 100 M100 100 L8 62 M100 100 L30 30 M100 100 L62 8 M100 100 L100 0" />
      <!-- Дуги паутины -->
      <path d="M100 80 Q82 82 80 100" />
      <path d="M100 60 Q64 64 60 100" />
      <path d="M100 40 Q46 46 40 100" />
      <path d="M100 20 Q28 28 20 100" />
      <path d="M100 0 Q10 10 0 100" />
    </svg>
  </div>

    </main>
  </div>
</div>

<script>
// ==========================================
// 1. ВЫБОР ИНГРЕДИЕНТОВ НА ПОЛКАХ (БАР)
// ==========================================
document.querySelectorAll('.item').forEach(function (el) {
  el.addEventListener('click', function () { 
    el.classList.toggle('selected'); 
  });
});


function showCobweb() {
  menuContainer.innerHTML = `
    <div class="cobweb-corner" style="position: absolute; bottom: 0; right: 0; pointer-events: none; opacity: 0.35;">
      <svg width="250" height="250" viewBox="0 0 100 100" style="fill: none; stroke: #d4a373; stroke-width: 1.2; stroke-linecap: round;">
        <!-- Лучи из правого нижнего угла (100, 100) -->
        <path d="M100 100 L0 100 M100 100 L8 62 M100 100 L30 30 M100 100 L62 8 M100 100 L100 0" />
        <!-- Дуги паутины -->
        <path d="M100 80 Q82 82 80 100" />
        <path d="M100 60 Q64 64 60 100" />
        <path d="M100 40 Q46 46 40 100" />
        <path d="M100 20 Q28 28 20 100" />
        <path d="M100 0 Q10 10 0 100" />
      </svg>
    </div>
  `;
}

// ==========================================
// 2. МАССИВ АНЕКДОТОВ БАРМЕНА
// ==========================================
var jokes = [
  `Коханка одяглася, зачісується біля дзеркала і питає чоловіка:\n— А твоя дружина теж гарна?\n— Та ні, така сама...`,
  `— Мій брат Моня може пробігти 100 метрів за вісім секунд.\n— Брехня! Світовий рекорд у бігу на стометрівку – дев'ять секунд.\n— Ну то й шо?! Моня знає короткий шлях!`,
  `Заходить равлик у бар і каже:\n— Келих пива, будь ласка.\n— Бармен бере її і викидає за двері. Минає рік. Равлик знову заповзає до бару:\n— І що це було?!`,
  `– Алло, це лінія допомоги алкоголікам?\n– Так.\n– Підкажіть як зробити мохіто!`,
  `Заходять два дракони у бар. Один каже:\n— Щось тут жарко...\nА другий йому відповідає:\n— А ти писка закрий.`,
  `Бормен так сильно звик до своєї роботи, що коли вдома дружина запитала його: «Коханий, ти мене любиш?», він на автоматі відповів:\n— Паспорт покажіть спочатку.`,
  `Бармен звертається до відвідувача, який щойно забіг:\n— Вітаю! Що бажаєте: пиво чи горілку?\n— Немає часу на розгойдування, давай горілку!`,
  `Бармен помічає сумного клієнта за стійкою:\n— О, я бачу, що у вас склянка вже порожня. Бажаєте ще одну?\n— А навіщо мені дві порожні склянки?`,
  `Заходит скелет у бар і каже:\n— Мені, будь ласка, бокал пива... і швабру.`,
  `Служба порятунку: екстрені служби. Дзвінок із бару:\n— Алло! Мій друг випив п'ять літрів пива, а потім з'їв пачку щурячої отрути! Що робити?!\n— Ну, тепер головне — не давайте йому пити воду, а то отрута розчиниться.\n— Зрозумів! А пиво ще можна?`,
  `— Бармен, налийте мне щось міцне, щоб забути про все!\n— Будь ласка, ось вам склянка незамерзайки.`,
  `Заходить у бар чоловік без ніг і каже:\n— Бармен, налий мені щось, щоб збивало з ніг!`,
  `Заходить у бар трунар і замовляє віскі:
— Ну що, як робота?
— Чудово, клієнти просто мертвим вантажем валять.`,
  `— Бармен, налийте мені щось міцне, щоб забути про все!`,
  `— Бармен, у моєму бокалі плаває муха і пищить!
— А що ви хотіли за такі гроші, щоб вона вам там румбу танцювала?`,
`Зустрілися двоє на вулиці:
— Хаїме, позич дві гривні.
— У мене з собою тільки одна.
— Ну давай один, а другу будеш мені винен.`,
`— Мойшо, ти знаєш, що наше життя як зебра? Смуга біла, смуга чорна...
— Ізя, я тебе благаю! Головне — до чорної смуги встигнути продати білу фарбу!`,
`— Офіціанте, у моєму супі плаває муха!
— І скільки, по-вашому, може з'їсти одна маленька муха, що ви підняли такий ґвалт?`
];

var lastJoke = -1;
var bell = document.getElementById('bell');
var menuContainer = document.getElementById('menu');
var bubble = document.getElementById('bubble');
var jokeContainer = document.getElementById('joke');

// Функция показа случайной шутки бармена
function showJoke() {
  if (!jokes.length) {
    jokeContainer.textContent = 'No jokes yet.';
    bubble.classList.add('show');
    return;
  }
  var i;
  do { i = Math.floor(Math.random() * jokes.length); }
  while (jokes.length > 1 && i === lastJoke);
  lastJoke = i;

  bubble.classList.remove('show');
  void bubble.offsetWidth; // Перезапуск CSS-анимации всплывающего облачка
  jokeContainer.textContent = jokes[i];
  bubble.classList.add('show');
}

// ==========================================
// 3. ЕДИНЫЙ ОБРАБОТЧИК КЛИКА НА ЗВОНОЧЕК
// ==========================================
bell.addEventListener('click', function () {
  // Анимация звоночка
  bell.classList.remove('ding');
  void bell.offsetWidth;
  bell.classList.add('ding');

  // Показываем шутку бармена
  showJoke();

  // Собираем выбранные ингредиенты
  var chosenIngredients = Array.from(document.querySelectorAll('.item.selected'))
                               .map(function (el) { return el.dataset.name; });

  if (chosenIngredients.length === 0) {
      menuContainer.innerHTML = '<p style="color: white; padding: 20px; font-family: Arial;">Виберіть хочаб один інгрідієнт на полках!</p>';
      jokeContainer.innerText = "Hey! You can't make a drink out of thin air!";
      return;
  }

  // Запрос к вашему C# DrinksController
  fetch('http://localhost:5000/api/drinks/by-ingredients', {
      method: 'POST',
      headers: {
          'Content-Type': 'application/json'
      },
      body: JSON.stringify(chosenIngredients)
  })
  .then(response => {
      if (!response.ok) {
          return response.json().then(err => { throw new Error(err.message); });
      }
      return response.json();
  })
  .then(drinks => {
      menuContainer.innerHTML = '';

      if (drinks.length === 0) {
          menuContainer.innerHTML = '<p style="color: white; padding: 20px; font-family: Arial;">Коктейлей с такими ингредиентами не найдено.</p>';
          return;
      }

      // Перебираем коктейли из MongoDB
      // Перебираем коктейли из MongoDB
drinks.forEach(function (drink) {
    var ingredientsHTML = '';
    
    // Получаем массивы ингредиентов и мер из JSON
    var ingredients = drink.ingredients || [];
    var measures = drink.measure || drink.measures || []; // поддерживает и measure, и measures

    ingredients.forEach(function(ing, index) {
        // Берем соответствующую меру по индексу (если есть)
        var measure = measures[index] ? measures[index].trim() : '';
        
        if (measure) {
            ingredientsHTML += `<li>${ing} <b style="color: #ccc;">${measure}</b></li>`;
        } else {
            ingredientsHTML += `<li>${ing}</li>`;
        }
    });

    // ПОЧИНКА КАРТИНКИ: добавили drink.imgUrl из вашего JSON
    var finalImageUrl = drink.imgUrl || drink.imagePath || drink.image || drink.imageUrl || 'https://www.thecocktaildb.com/images/media/drink/2x8thr1504816928.jpg';

    var card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('data-ing', ingredients.join(','));

    card.innerHTML = `
      <div class="img">
        <img src="${finalImageUrl}" alt="${drink.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=No+Image';">
      </div>
      <div class="strength" style="--s:${drink.strength || '30'}%"></div>
      <div class="info">
        <h3>${drink.name}</h3>
        <ul>
          ${ingredientsHTML}
        </ul>
      </div>
    `;
    menuContainer.appendChild(card);
});
  })
  .catch(error => {
      console.error('Помилка запиту до сервера', error);
      menuContainer.innerHTML = `<p style="color: #ff8888; padding: 20px; font-family: Arial;">Ошибка сервера: ${error.message}</p>`;
  });
});
</script>


</body>
</html>
